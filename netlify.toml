[build]
  base = "frontend"
  # Install dependencies (including devDependencies like Vite) before building,
  # then run Vite via npx to avoid any permission issues with the vite binary.
  command = "npm install && npx vite build"
  publish = "dist"

# SPA fallback (so refresh/deep links don't 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

